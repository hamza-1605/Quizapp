name: quiz_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  http: ^1.6.0
  sqflite: ^2.4.5
  path: ^1.9.1
  cached_network_image: ^4.0.6
  flutter_cache_manager: ^3.5.0
  flutter_confetti: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon_full.png"
  adaptive_icon_background: "#001050"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#001050"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#001050"
    image: assets/branding/icon_foreground.png